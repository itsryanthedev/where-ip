name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'scripts/package-desktop.mjs'
      - 'src/**'
      - 'public/**'
      - 'app.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'electron/**'
      - 'scripts/package-desktop.mjs'
      - 'src/**'
      - 'public/**'
      - 'app.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan tracked files and Git history for secrets
        run: node scripts/check-secrets.mjs --history

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run desktop allowlist tests
        run: pnpm run electron:test

      - name: Export desktop web bundle
        run: pnpm run export:desktop

      # package-desktop.mjs downloads the Electron zip via @electron/get when needed.
      - name: Package unsigned desktop app
        run: node ./scripts/package-desktop.mjs

      - name: Confirm package output exists
        shell: bash
        run: |
          set -euo pipefail
          test -d out
          find out -maxdepth 3 -type d -print | head -n 20
