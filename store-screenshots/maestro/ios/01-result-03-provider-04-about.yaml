appId: com.itsryanthedev.whereip
---
- launchApp:
    clearState: true
- tapOn: "Acknowledge and continue"
- extendedWaitUntil:
    visible: "Provider,"
    timeout: 60000
- takeScreenshot: s01
- tapOn: "Provider,"
- extendedWaitUntil:
    visible: "Preferred IP information provider"
    timeout: 10000
- takeScreenshot: s03
- tapOn: "Dismiss provider menu"
- tapOn: "About WhereIP and privacy"
- extendedWaitUntil:
    visible: "About WhereIP"
    timeout: 15000
- takeScreenshot: s04
